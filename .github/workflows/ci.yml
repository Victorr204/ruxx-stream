name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24 is required: the *.test.mjs files import .ts sources directly
          # and Node runs them via built-in type stripping, which Node 20
          # lacks (ERR_UNKNOWN_FILE_EXTENSION).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
