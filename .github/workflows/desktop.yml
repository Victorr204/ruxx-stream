# Builds the desktop app: web export → Electron installers.
#
#   • Tag push (v*) or manual run builds everything.
#   • Windows installer: ruxx-stream-setup-<version>-x64.exe / -arm64.exe
#   • macOS DMGs: ruxx-stream-<version>-x64.dmg / -arm64.dmg
#   • latest*.yml + *.blockmap files power auto-updates — upload them to the
#     site's /downloads folder together with the installers.
#   • The release also carries version-less aliases (ruxx-stream-setup-x64.exe,
#     …) so the website can link to
#       https://github.com/<owner>/<repo>/releases/latest/download/ruxx-stream-setup-x64.exe
#     once and never be updated again.
#
# Deployment to https://app.ruxxdigital.name.ng/downloads is a separate,
# optional step: set the RUXX_DEPLOY_* repository secrets (see the deploy
# job below) and it runs automatically on tag pushes.

name: Desktop (Windows / macOS)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-web:
    name: Export web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export the web bundle
        # Publishable keys (anon key, AdSense client) fall back to the values
        # already committed in eas.json; override via repo secrets anytime.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://fcpjduweupgnyqkfqlqx.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable__5BYqCcLVbm30GUECwetrA_0Cld4ZaL' }}
          EXPO_PUBLIC_SITE_URL: ${{ secrets.EXPO_PUBLIC_SITE_URL || 'https://app.ruxxdigital.name.ng' }}
          EXPO_PUBLIC_ADSENSE_CLIENT: ${{ secrets.EXPO_PUBLIC_ADSENSE_CLIENT || 'ca-pub-9942550938838021' }}
          EXPO_PUBLIC_ADSENSE_BANNER_SLOT: ${{ secrets.EXPO_PUBLIC_ADSENSE_BANNER_SLOT || '' }}
          EXPO_PUBLIC_ADSENSE_INTERSTITIAL_SLOT: ${{ secrets.EXPO_PUBLIC_ADSENSE_INTERSTITIAL_SLOT || '' }}
        run: npx expo export --platform web --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          retention-days: 3

  build-desktop:
    name: Build installers (${{ matrix.os }})
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installers
        working-directory: desktop
        # CSC_IDENTITY_AUTO_DISCOVERY=false skips macOS signing attempts
        # (no Apple certificate yet — see desktop/electron-builder.yml).
        # electron-builder downloads ~200 MB of Electron + tooling per run;
        # a dropped download aborts the whole job, so retry before failing.
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          for attempt in 1 2 3; do
            if npm run dist; then
              exit 0
            fi
            echo "::warning::installer build failed (attempt $attempt of 3), retrying in 15s"
            sleep 15
          done
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/latest*.yml
            desktop/release/*.blockmap
          retention-days: 14

  deploy:
    name: Publish to /downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: desktop-*
          merge-multiple: true

      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.RUXX_DEPLOY_HOST }}
        run: echo "has_host=$([ -n "$DEPLOY_HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload installers to the site
        if: steps.check.outputs.has_host == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.RUXX_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.RUXX_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.RUXX_DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.RUXX_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            out/*.exe out/*.dmg out/latest*.yml out/*.blockmap \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

      - name: Skipped (no deploy secrets)
        if: steps.check.outputs.has_host != 'true'
        run: |
          echo "No RUXX_DEPLOY_HOST secret set — installers are attached to"
          echo "this workflow run only. Copy them into the site's /downloads"
          echo "folder manually, or set the deploy secrets."

  # Permanent download links for the website: pushing a tag (v1.0.0) builds
  # everything and attaches the installers to a GitHub Release. Each installer
  # is uploaded twice — under its versioned name (ruxx-stream-setup-1.0.0-x64.exe)
  # and under a version-less alias (ruxx-stream-setup-x64.exe), because the
  # website links must not have to change on every release:
  #   https://github.com/Victorr204/ruxx-stream/releases/latest/download/ruxx-stream-setup-x64.exe
  # The alias only ever points at the newest release; auto-update keeps using
  # the versioned names (latest.yml lists them), so it is unaffected.
  release:
    name: Attach installers to a GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: desktop-*
          merge-multiple: true

      - name: Add version-less aliases for the website
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in out/*.exe out/*.dmg; do
            base=$(basename "$f")
            stable=$(printf '%s' "$base" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+//')
            if [ "$stable" != "$base" ]; then
              cp "$f" "out/$stable"
              echo "alias: $base -> $stable"
            fi
          done
          echo "Release assets:"
          ls -1 out/

      - name: Create the release and upload the installers
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout step, so gh cannot discover the repo
          # from a git remote — tell it explicitly.
          GH_REPO: ${{ github.repository }}
        # Surface gh's own error text as an annotation so the failure is
        # readable without opening the raw log.
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if ! err=$(gh release create "$GITHUB_REF_NAME" \
                --verify-tag \
                --title "Ruxx Stream $GITHUB_REF_NAME" \
                --generate-notes \
                out/* 2>&1); then
              echo "::error::gh release create failed: $err"
              exit 1
            fi
          fi
          if ! err=$(gh release upload "$GITHUB_REF_NAME" out/* --clobber 2>&1); then
            echo "::error::gh release upload failed: $err"
            exit 1
          fi

